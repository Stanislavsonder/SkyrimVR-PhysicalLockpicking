; VR Physical Lockpicking - configuration
;
; The easy way: the in-game settings menu (Mod Configuration Menu, in the journal's System tab
; "Mod Configuration"; needs SkyUI VR and MCM Helper). Values changed there are saved to
; Data\MCM\Settings\VRLockpicking.ini and override this file.
; Distances are Skyrim units (1 unit ~ 1.43 cm), angles are degrees. Edit and restart the game.

[General]
; Master switch. 0 = always the vanilla lockpicking menu.
bEnabled = 1
; 1 = the pick in the LEFT hand and the tension wrench in the RIGHT. With bAlternativeMode = 0 the
; controls are then mirrored: the pick searches along the left side, the tension wrench starts with
; the back of your hand to the right, and the lock turns anticlockwise.
bLeftHandedPick = 0
; Follow Skyrim VR's own left-handed mode (bLeftHandedMode) when reading the controllers.
bFollowLeftHandedMode = 1
; Pause the game the way menus (and the vanilla lockpicking menu) do: nothing in the world moves
; or reacts while you pick a lock. 0 = the game goes on around you.
bFullPause = 1
; Open a container after picking its lock (like vanilla).
bActivateContainerAfterUnlock = 1
; Being seen picking an owned lock is a crime (like vanilla).
bCrimeCheck = 1
; Pick and lock state and the controller axes in the log once per second
; (Documents\My Games\Skyrim VR\SKSE\VRLockpicking.log).
bDebugLogging = 0

[Placement]
; Moves the lock to the right of where it appears in front of you (- = left).
fLockSideOffset = 0.0
; Moving your head this far from the lock gives up. With the lock on a door or chest you activated
; from further away, it counts from there.
fCancelDistance = 300.0
; 1 = the lock sits on the door or chest itself; 0 = it appears in front of you. On the object you
; may have to step up to it. Where it sits on each model can be lined up with the markup tool.
bLockOnObject = 1
; With the lock on the door or chest: 1 = you can walk and turn while picking (the game is then not
; paused); 0 = you stay where you are.
bMoveWhilePicking = 1

[Controls]
; 1 = alternative mode (default): you search by turning your wrist, and the tension wrench twists
;     clockwise from any start.
; 0 = like the vanilla minigame: once a tool is in the keyhole its tip stays there. The pick (right
;     hand) goes in with its handle up and searches by sweeping the handle clockwise down the right
;     side. The tension wrench (left hand) goes in with the back of your hand to the left and turns
;     the lock like a key until the back of your hand points up.
bAlternativeMode = 1
; Distance from the fist to the tool tip.
fToolLength = 15.0
; A tool tip goes into the keyhole when it comes this close to its centre (the green target), and
; once in, stays in until it strays 12 units from it sideways, 8 units further in or 4 units back
; out, so shaky hands don't pull it out. The point offsets move the pick's spot up and the tension wrench's down,
; if you want them apart.
fInsertRadius = 3.0
fWrenchInsertRadius = 3.0
fPickPointOffset = 0.0
fWrenchPointOffset = 0.0
; The keyhole is a short cylinder on its axis: from fInsertFront in front of the keyhole plane down
; to fMaxDepth into the lock (once in, a little more). Deeper = pushed through the lock.
fInsertFront = 0.0
fMaxDepth = 3.0
; With bAlternativeMode = 0: the pick goes in with its handle within this many degrees of its half of the
; keyhole; the tension wrench's start (0 = back of the hand up, -90 = left) and how close to it it has
; to be to go in; the pick's angle holds while its handle is this close to the keyhole axis; an
; inserted pick is shown tilted out of the lock face within this range.
fPickEngageMargin = 15.0
fWrenchStartAngle = -90.0
fWrenchStartTolerance = 25.0
fLeverMinRadius = 1.5
fToolMinTilt = 10.0
fToolMaxTilt = 90.0
; How far (degrees) the tension wrench is turned for a full turn of the lock (vanilla: 90).
fFullTurnTwist = 90.0
; Smoothing of the pick angle (1-euro filter): how much while your hand is still (Hz, lower =
; steadier, 0 = off) and how quickly that eases off as you sweep (higher = less lag).
fPickFilterMinCutoff = 1.0
fPickFilterBeta = 0.05
; The fist grip in the hand's own space (right hand; the left is mirrored), from HIGGS. Only change
; these if the tools sit skewed in every hand.
vHandPointing = 0.0, 0.0, 1.0
vHandPalm = -0.018, -0.965, 0.261
vHandGripPos = 0.0, -2.4, 6.0
vGripRotation = 0.0, 0.0, 0.0
vPickTipOffset = 0.0, 0.0, 0.0
vTensionGripOffset = 0.0, 0.0, 0.0

[Difficulty]
; Multiplies the vanilla sweet spot size (skill, perks and lock level still apply).
fSweetSpotMult = 1.0
; Degrees beyond the sweet spot in which the lock turns partially.
fPartialZone = 30.0
; Multiplies the vanilla pick break time.
fBreakTimeMult = 1.0
; How far (0..1) you may over-twist past the lock's limit before the pick takes damage.
fForceSlack = 0.10
; Lock rotation speed (fraction of a full turn per second) and spring-back speed.
fLockTurnSpeed = 1.6
fLockReturnSpeed = 3.0

[Haptics]
; Overall vibration strength 0..1.
fStrength = 1.0
; While both tools are in the lock you feel short searching pulses (each fPulseLength seconds):
;  far from the sweet spot every fPulseSlowInterval seconds at fPulseFarStrength;
;  within fPulseNearDegrees of its edge a sharp step to fPulseNearInterval / fPulseNearStrength,
;  changing smoothly to fPulseSweetInterval / fPulseSweetStrength at its edge; those inside it.
fPulseLength = 0.025
fPulseSlowInterval = 0.50
fPulseFarStrength = 0.45
fPulseNearDegrees = 10.0
fPulseNearInterval = 0.40
fPulseNearStrength = 0.45
fPulseSweetInterval = 0.30
fPulseSweetStrength = 0.45
; Forcing a pick that is about to break: a steady rattle (every fStrainInterval seconds at
; fStrainStrength) instead of every other pulse.
fStrainInterval = 0.08
fStrainStrength = 0.90
; An extra click every N degrees the pick moves inside the lock. 0 = off.
fTickDegrees = 0.0

[Visuals]
; 0 = no lock and tool models (vibration and sound only).
bShowMeshes = 1
; 1 = how many lockpicks you have left, shown by the lock.
bShowPickCount = 0
; Half-size of the lock's face, and length of the tool models (tip to end of the handle).
fLockMeshRadius = 8.0
fToolMeshLength = 16.0
; Assist ring on the lock face: 0 = off (by feel only), 1 = where your pick is along its range,
; 2 = also the sweet spot on Novice and Apprentice locks.
iAssistRing = 0
; Lock Variations (and other mods with Data\*_LID.ini files): their lock / lockpick models and
; lockpicking sounds per lock.
bLockVariations = 1
; Debug tools (MCM Debug page):
; the lock and tools as coloured blocks with gauges and numbers;
bDebugView = 0
; the keyhole target (a see-through green cylinder), the tool tip cubes and the gauges over the models;
bShowTargets = 0
; the model markup tool, saved per model to Data\SKSE\Plugins\VRLockpicking_Locks.ini. Three parts in
; turn (A / X goes to the next):
;  1. lock: put the pick's tip (its cube) on the keyhole's centre and press the left trigger, then
;     on the keyhole's top, then once more to save; a stick click goes a step back.
;  2. pick and 3. tension wrench: hold the left trigger, the model stays still while your hand moves;
;     let go, it moves with the hand again in the new grip (saved and logged). Right stick swings
;     it about its tip, left stick rolls it, right trigger + right stick sizes it; stick click =
;     back to automatic.
bMarkupMode = 0
